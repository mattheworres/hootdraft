build:
    image: default-bionic
    nodes:
        analysis:
            project_setup:
                override: true
            tests:
                override:
                    - php-scrutinizer-run --enable-security-analysis
    environment:
        php: 8.5.12

checks:
    php: true

filter:
    excluded_paths:
        - tests/*
        - resources/*
        - gulp/*
        - deploy/*
        - db/*
