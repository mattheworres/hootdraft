# HootDraft dev server (HTTP only). Adapted from EXAMPLE_nginx at the repo root.
#
# Whitelist: the repo root is the web root, so only these are ever reachable --
#   /api/*                           -> Symfony front controller (api/index.php)
#   /css /js /fonts /images, favicon -> built AngularJS assets, as files
#   anything else                    -> index.html (AngularJS routing)
# Source, config, vendor/, .env*, docker/, db/, tests/ etc. can never be served because no location maps to them.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;

    # Never expose dotfiles (.git, .env, .htaccess, ...), even under an allowed path
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location = /api {
        return 301 /api/;
    }

    # API: every /api/ request is handed to the PHP front controller. The original REQUEST_URI is
    # preserved so Symfony strips the /api base itself and routes match the old Silex URLs.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_pass php:9000;
    }

    # Built static assets: a missing file is a real 404, not the AngularJS app
    location ~ ^/(css|js|fonts|images)/ {
        try_files $uri =404;
    }
    location = /favicon.ico {
        try_files $uri =404;
    }

    # Everything else is the AngularJS app
    location / {
        try_files /index.html =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
