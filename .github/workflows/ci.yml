name: CI

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: composer check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start the developer box
        run: |
          cp docker/.env.example docker/.env
          APP_UID=$(id -u) docker compose up -d --build --wait

      # The mounted repo is owned by the runner's uid, which git in the container does not trust
      - name: Trust the mounted repository
        run: docker compose exec -T php git config --global --add safe.directory /var/www/html

      - name: Install the PHP packages and migrate the database
        run: |
          docker compose exec -T php composer install --no-interaction --no-progress
          docker compose exec -T php vendor/bin/phinx migrate -e production

      - name: PHPStan, glossary terms, and tests
        run: docker compose exec -T php composer check

  e2e:
    # A static name: GitHub appends the matrix value itself, and shows an unexpanded expression when the job is skipped
    name: E2E
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPORT_RETENTION_DAYS: 7
    strategy:
      fail-fast: false
      matrix:
        # Chromium on each push. All four browsers on a pull request, which is the gate before merge.
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium", "firefox", "webkit", "edge"]') || fromJSON('["chromium"]') }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # The E2E stack serves the built client from the repo root, so the build comes before the stack
      - name: Build the AngularJS client
        run: |
          yarn install --frozen-lockfile
          npx gulp build

      - name: Install the E2E packages
        working-directory: e2e
        run: npm ci

      - name: Install the browser
        working-directory: e2e
        run: npx playwright install --with-deps ${{ matrix.browser == 'edge' && 'msedge' || matrix.browser }}

      - name: Start the E2E stack
        working-directory: e2e
        run: |
          npm run stack:up
          docker compose -f stack/docker-compose.yml exec -T php composer install --no-interaction --no-progress

      # The checks of the helpers do not test a client, so they run in the Chromium job only
      - name: Run the E2E suite
        working-directory: e2e
        run: npx playwright test --project=${{ matrix.browser }} ${{ matrix.browser == 'chromium' && '--project=helpers' || '' }}

      - name: Keep the report of a failed run
        id: report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

      - name: Link the report in the run summary
        if: failure() && steps.report.outputs.artifact-url
        run: |
          expiry=$(date -u -d "+$REPORT_RETENTION_DAYS days" '+%b %-d %Y')
          echo "[Playwright report of ${{ matrix.browser }}](${{ steps.report.outputs.artifact-url }}) (expires $expiry)" >> "$GITHUB_STEP_SUMMARY"
